# A Cairn instance with TLS, for a small self-hosted deployment.
#
# The server terminates no TLS of its own and is not safe to expose directly, so this
# publishes **only** Caddy. `cairn` has no `ports:` on purpose — it is reachable on the
# internal network and nowhere else. Adding a `ports:` line to it would put a plaintext,
# unauthenticated HTTP server on the public internet.
#
# See docs/11-self-hosting.md. Set CAIRN_DOMAIN and CAIRN_INVITES in a `.env` beside this
# file before `docker compose up -d`.

services:
  cairn:
    build: .
    restart: unless-stopped
    environment:
      # Invite-only by default. Open registration lets anyone claim any unused user id,
      # including one a friend was about to take.
      CAIRN_REGISTRATION_POLICY: invite_only
      # Comma-separated, minted at boot. There is no admin API yet, so this is how an
      # operator hands out access. Re-minted on every restart, so treat a spent token as
      # spent regardless of what the server says after a reboot.
      CAIRN_INVITES: ${CAIRN_INVITES:?set CAIRN_INVITES in .env, e.g. a couple of long random strings}
      # Registration is limited per address, and every connection here comes from Caddy.
      # Naming Caddy lets the instance believe the X-Forwarded-For it adds — and only that
      # one host's, because anyone can send the header. Must match caddy's address below.
      CAIRN_TRUSTED_PROXIES: 172.30.0.2
      # GIF search, off unless a key is set. Either, both or neither; with neither, the
      # picker says GIF search is not configured here. Each key is shared with every
      # account on this instance (the client needs it inside its own TLS to the provider),
      # and KLIPY's standard terms forbid the relay, re-hosting and ad filtering this
      # design relies on without their written approval. Read docs/11-self-hosting.md
      # ("GIF search") before uncommenting.
      # CAIRN_KLIPY_API_KEY: ${CAIRN_KLIPY_API_KEY:-}
      # CAIRN_GIPHY_API_KEY: ${CAIRN_GIPHY_API_KEY:-}
      # A TURN relay for calls, off unless both are set (see the commented `coturn` service
      # below and docs/11-self-hosting.md, "A TURN relay for calls"). Relayed media crosses
      # *your* connection, and the relay sees the IP address of everyone it relays. The
      # instance hands short-lived credentials only to members of the room a call is in.
      # CAIRN_TURN_URLS: stun:${CAIRN_DOMAIN}:3478,turn:${CAIRN_DOMAIN}:3478
      # CAIRN_TURN_SECRET: ${CAIRN_TURN_SECRET:?set CAIRN_TURN_SECRET in .env, e.g. openssl rand -hex 32}
      # CAIRN_TURN_TTL_SECS: "14400"
      RUST_LOG: ${RUST_LOG:-info}
    networks:
      - internal
    volumes:
      # Holds the franking key. Losing it invalidates every report the instance ever
      # issued, so this is the thing to back up.
      - cairn-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CAIRN_DOMAIN: ${CAIRN_DOMAIN:?set CAIRN_DOMAIN in .env, e.g. cairn.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Without this volume every restart re-issues,
      # and Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      internal:
        # Fixed, so the trust above names exactly this container. Not `.1`: that is the
        # bridge gateway, which is where a connection would appear to come from if somebody
        # published a port on `cairn` — and that one must not be believed.
        ipv4_address: 172.30.0.2
    depends_on:
      - cairn

  # The optional TURN relay. Uncomment together with the CAIRN_TURN_* lines above.
  #
  # Host networking, because a relay allocates a UDP port per call leg and publishing a
  # range of them through Docker's proxy is slow and fragile. That makes this the one
  # service on the host's network, so the denied-peer-ip lines matter: without them a
  # member could relay traffic into your LAN or to this machine's own services.
  #
  # coturn:
  #   image: coturn/coturn:4.6
  #   restart: unless-stopped
  #   network_mode: host
  #   command:
  #     - --use-auth-secret
  #     - --static-auth-secret=${CAIRN_TURN_SECRET}
  #     - --realm=${CAIRN_DOMAIN}
  #     - --listening-port=3478
  #     - --min-port=49160
  #     - --max-port=49200
  #     - --no-cli
  #     - --no-multicast-peers
  #     - --denied-peer-ip=10.0.0.0-10.255.255.255
  #     - --denied-peer-ip=172.16.0.0-172.31.255.255
  #     - --denied-peer-ip=192.168.0.0-192.168.255.255
  #     - --denied-peer-ip=127.0.0.0-127.255.255.255
  #     - --user-quota=12
  #     - --total-quota=1200

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  cairn-data:
  caddy-data:
  caddy-config:
