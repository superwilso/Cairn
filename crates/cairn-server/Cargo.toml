[package]
name = "cairn-server"
description = "Cairn instance server. Runs on Linux, Windows, and macOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true
authors.workspace = true

[dependencies]
cairn-proto.workspace = true
cairn-crypto.workspace = true

axum.workspace = true
# `io-util` for the GIF relay, which copies bytes between two sockets itself so it can
# enforce the limits `gif_relay.rs` sets on each tunnel.
tokio = { workspace = true, features = ["io-util"] }
tower-http.workspace = true
# Both already in the tree under axum. Named directly because the GIF relay takes over the
# connection with an HTTP/1.1 upgrade, which axum only exposes for WebSockets.
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
uuid.workspace = true
redb = "2.6"
sha2.workspace = true
subtle.workspace = true
rand.workspace = true
zeroize.workspace = true
# coturn's REST-auth relay credentials (state.rs, "TURN relay credentials"): the scheme is
# HMAC-SHA1, base64. All three are already in the lock file.
hmac.workspace = true
sha1 = "0.10"
base64 = "0.22"
# The voice-channel SFU (`sfu.rs`, docs/adr/012-sfu-voice-channels.md). Sans-IO WebRTC:
# ICE, DTLS, SRTP and RTCP are the library's; the forwarding decisions are ours. Pure-Rust
# crypto backend, through the patched copy in vendor/str0m-rust-crypto: the published one also
# compiles in aws-lc-rs, and dimpl then prefers it (see VENDORED.md). MIT/Apache-2.0.
#
# **Needs rustc 1.88**, above the workspace floor: str0m, str0m-proto and dimpl all depend on
# `time`, which needs 1.88 from 0.3.47, the release that fixed RUSTSEC-2026-0009. Hence the
# `sfu` feature: on by default, off in the MSRV check, which still covers the rest of the crate.
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"], optional = true }

[features]
default = ["sfu"]
# Voice channels' media server. Without it the instance runs no SFU and offers no voice channels.
sfu = ["dep:str0m"]
# Lets a test harness read the frames the SFU forwarded, to prove they are sealed. Never on
# in a build anyone runs: production has no way to record media.
test-tap = ["sfu"]

[[example]]
name = "sfu_harness"
required-features = ["test-tap"]

[dev-dependencies]
cairn-client-core.workspace = true
# A stand-in GIF provider for the relay's tests, speaking real TLS so the tunnel is tested
# with what it will actually carry. Same version and backend the client already uses.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
