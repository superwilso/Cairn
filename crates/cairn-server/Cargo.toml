[package]
name = "cairn-server"
description = "Cairn instance server. Runs on Linux, Windows, and macOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true
authors.workspace = true

[dependencies]
cairn-proto.workspace = true
cairn-crypto.workspace = true

axum.workspace = true
# `io-util` for the GIF relay, which copies bytes between two sockets itself so it can
# enforce the limits `state.rs` sets on each tunnel.
tokio = { workspace = true, features = ["io-util"] }
tower-http.workspace = true
# Both already in the tree under axum. Named directly because the GIF relay takes over the
# connection with an HTTP/1.1 upgrade, which axum only exposes for WebSockets.
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
uuid.workspace = true
redb = "2.6"
sha2.workspace = true
subtle.workspace = true
rand.workspace = true

[dev-dependencies]
cairn-client-core.workspace = true
