[package]
name = "cairn-client-core"
description = "Cairn shared client logic. Platform UIs bind to this; it contains no UI code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
authors.workspace = true

[dependencies]
cairn-proto.workspace = true
cairn-crypto.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex.workspace = true
uuid.workspace = true

# Optional so the crate still builds for FFI targets that supply their own networking.
# `ureq` is blocking and rustls-backed, which matches the rest of the client: `mls-rs` is
# sync here, so no async runtime has to cross the FFI boundary (ADR-006).
ureq = { version = "3", optional = true }
# The GIF relay (`gifs`): this client speaks TLS to the provider *through* a tunnel the
# instance opens, which `ureq` cannot be pointed at. The same rustls and roots `ureq`
# already brings in, named directly; `httparse` is already in the tree under the server.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
webpki-roots = { version = "1", optional = true }
httparse = { version = "1", optional = true }

[features]
default = ["http"]
http = ["dep:ureq", "dep:rustls", "dep:webpki-roots", "dep:httparse"]
