[package]
name = "cairn-interop"
description = "Cairn's MLS against another RFC 9420 implementation. Tests only; nothing ships."
version = "0.0.1"
edition = "2021"
# The workspace floor, kept here by hand because this is not a member of that workspace.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/superwilso/Cairn"
authors = ["The Cairn Contributors"]
publish = false

# A workspace of its own, outside the main one, so that what it pulls in stays out of the
# main lock file and therefore out of the release's `cargo audit`. OpenMLS's dependency tree
# lists `libcrux-*` crates with open RustSec advisories. The rust-crypto backend used here
# does not compile most of them, and none of it is in any Cairn build, but the main audit
# reads the lock file and would fail on them. Run with:
#
#     cargo test --manifest-path interop/Cargo.toml --locked
[workspace]

[dependencies]

[dev-dependencies]
cairn-proto = { path = "../crates/cairn-proto" }
cairn-crypto = { path = "../crates/cairn-crypto" }
# The independent implementation.
#
# Held at 0.8: 0.9 and its crypto backend need rustc 1.91, above the floor of 1.88. 0.8
# builds on 1.88, and RFC 9420 did not change between them.
openmls = "0.8"
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_traits = "0.5"
