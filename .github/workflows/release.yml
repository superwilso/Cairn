# Build the desktop client and publish it to GitHub Releases.
#
# ## Why this is not on every push
#
# A Tauri build compiles the whole workspace plus the webview bindings and then runs an
# installer packager, and what it produces is a release, not a check — `ci.yml` already
# builds and tests every platform. This runs only on a version tag or when asked by hand.
#
# ## Windows and Linux
#
# Linux was held back while WebKitGTK denied the microphone (wry answers only the clipboard
# permission). The client now answers WebKitGTK's permission-request signal for media itself
# (`grant_media_requests` in main.rs), so the Linux leg is on. No macOS build yet.
#
# ## What has and has not been exercised
#
# **This workflow has never run.** It was written on Linux, where a Windows installer cannot
# be produced or verified.
#
# What *was* exercised locally, because a first run on a slow Windows runner is a poor
# place to discover a typo:
#
#   - **The exact build command below**, `cargo tauri build --bundles <type>`, against this
#     exact config, through to a finished bundle (`--bundles deb` on Linux). That covers
#     config parsing, `frontendDist` resolution, the icon set, the CSP, and where the
#     bundler puts its output — which is the workspace target directory at the repository
#     root, not under `src-tauri`. The collect step below was written from that observed
#     path rather than a guess, and lists what it found either way.
#   - `icons/icon.ico` compiled by `llvm-rc` into a Windows resource — the step `tauri-build`
#     runs, and the one it **hard-errors** on if the file is missing. `ci.yml` now checks
#     every icon the bundle config names before a runner is ever started.
#   - The built release binary starts and serves its embedded frontend.
#
# What remains genuinely unverified is the Windows-only half: NSIS and WiX packaging, and
# WebView2 at runtime.

name: Release

on:
  push:
    tags:
      - 'v*'
  # So a build can be produced from a branch without cutting a version tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish under (e.g. v0.0.1-alpha.1)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not discard the artefacts of one that succeeded.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (x86_64)
            bundles: nsis,msi
          - os: ubuntu-22.04
            name: Linux (x86_64)
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Tauri needs the system webview and its build tooling on Linux. Nothing to do on
      # Windows, where WebView2 ships with the OS and Tauri's installer bootstraps it where
      # it is missing.
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf file

      - uses: Swatinem/rust-cache@v2

      # Fail on a compile error here rather than 15 minutes into the bundler, where it would
      # be buried in installer output.
      - name: Check the client compiles
        run: cargo check -p cairn-desktop

      # `cargo install tauri-cli` compiles the CLI from source, which costs more billed
      # runner minutes than the build it exists to run. binstall fetches the prebuilt one.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install the Tauri CLI
        run: cargo binstall --no-confirm --locked "tauri-cli@^2"

      - name: Build the bundle
        working-directory: clients/desktop/src-tauri
        # `--bundles` overrides the config's target list, which names Linux formats too:
        # asking a Windows runner for a .deb is a confusing way to fail. This exact command
        # was run locally against this exact config, through to a finished bundle.
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      # The instance server ships beside the client, so someone trying Cairn on Windows can run
      # their own instance without installing a Rust toolchain. Same workspace target dir.
      - name: Build the instance server
        run: cargo build --release -p cairn-server

      # The bundle lands in the *workspace* target directory at the repository root, not
      # under src-tauri — verified locally rather than assumed. The listing is deliberate:
      # if the layout ever moves, the log says where to.
      - name: Collect the installers
        shell: bash
        run: |
          echo "--- everything the bundler produced ---"
          find target/release/bundle -type f -print
          mkdir -p dist
          find target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          if [ -f target/release/cairn-server.exe ]; then cp target/release/cairn-server.exe dist/; fi
          if [ -f target/release/cairn-server ]; then cp target/release/cairn-server dist/; fi
          echo "--- to be published ---"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # A hand-run build from a branch must tag the commit it built, not the default
          # branch's head, or the release would claim code it does not contain.
          target_commitish: ${{ github.sha }}
          name: Cairn ${{ github.event.inputs.tag || github.ref_name }}
          # Pre-alpha, and it says so where somebody will actually read it. Marking it
          # otherwise would be the first dishonest thing this project shipped.
          prerelease: true
          draft: false
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            ## Cairn desktop — pre-alpha

            **Not audited. Not reviewed. Do not use this for anything that matters yet.**
            Built from a branch whose security-relevant changes are still waiting for the
            owner's review; see the linked pull request.

            ### Downloads

            - **Windows:** `Cairn_*_x64-setup.exe` (or the `.msi`), and `cairn-server.exe`.
            - **Linux:** `Cairn_*_amd64.AppImage` (or the `.deb`), and `cairn-server`. The
              AppImage needs `chmod +x` and WebKitGTK 4.1 (most current distros ship it).

            Neither is code-signed, so Windows SmartScreen will warn you: **More info → Run
            anyway**.

            ### What works

            - **Encrypted group chats** (MLS, RFC 9420): the instance stores ciphertext it cannot
              read. Reactions, attachments, voice notes, disappearing messages. (Replies and
              editing are not built yet.)
            - **Spaces, channels and roles**: a space holds channels, each an ordinary room with
              its own fixed tier; roles carry permissions under a strict rank rule, with
              per-channel overrides. Roles are the instance's metadata — it sees them, and a
              malicious instance could fabricate them (it still cannot read encrypted channels).
            - **Calls**: ringing with accept/decline and missed-call notices, mute and deafen,
              speaking indicator, push-to-talk (while the window is focused), per-person volume,
              noise suppression / echo cancellation / gain toggles, screen sharing. Optional TURN
              relay, opt-in, if your instance operator configures one.
            - **Voice channels**: drop in and out of a room's voice channel, audio only, through
              an SFU built into the instance. In an encrypted room the audio stays end-to-end
              encrypted through it; if someone cannot do that, the call shows its own badge and
              tells everyone. The SFU sees who is connected, when, and packet sizes and timing.
            - **Profiles and customisation**: encrypted profiles, nicknames, themes, custom CSS.
            - **Custom emoji, stickers and a soundboard** per room, as one encrypted set. Each
              listener can turn one person's clips down, or everyone's off. Whoever carries the
              audio can tell when a clip plays, not which.
            - **Link previews** made by the sender (off by default, per-site opt-in) and **GIF
              search** through the instance — needs the operator's KLIPY or GIPHY key.

            ### What does not (yet)

            - **Calls you ring are a mesh**: everyone sends to everyone, and each person sees
              the others' IP addresses unless the relay is on. Voice channels use the SFU instead.
            - **Voice channels are audio only**, with no TURN in front of the SFU, and you leave
              the channel if you open another room.
            - **Rings only reach the room you have open.**
            - **No macOS build.** Linux calls are new in this build: microphone access is now
              granted by the app itself, but has not yet been tried on a real Linux desktop.
            - **No key backup.** Losing the profile directory loses that device's history.
            - Only exercised in Chromium-based test harnesses and WebView2 builds, never by a
              person on two real machines. Expect rough edges and please report them.

            ### Starting

            1. Run your own instance. In PowerShell, in a folder where it may keep a `data`
               directory:

               ```powershell
               $env:CAIRN_REGISTRATION_POLICY = "invite_only"
               $env:CAIRN_INVITES = "me-7f3k9q2m4x8w,friend-2n6v1r5t9z3c"
               $env:CAIRN_SFU_BIND = "127.0.0.1:3480"   # voice channels; omit to turn them off
               .\cairn-server.exe
               ```

               It listens on `127.0.0.1:8080`. For a friend on another machine, set
               `$env:CAIRN_BIND = "0.0.0.0:8080"`, plus `$env:CAIRN_SFU_BIND = "0.0.0.0:3480"` and
               `$env:CAIRN_SFU_ADVERTISE = "<your-ip>:3480"` for voice channels (UDP; allow it
               through Windows Firewall), and give them your address — but over plain
               `http://` account ids, membership and timing are visible on the network (message
               bodies stay end-to-end encrypted). Put it behind TLS for anything real.
            2. Install and open Cairn, enter `http://127.0.0.1:8080` as the instance, pick a
               username, and paste one of the invite codes.
            3. Your friend does the same with the other code, pointing at your instance.

            **On Linux** the same steps work in a terminal:

            ```bash
            chmod +x cairn-server Cairn_*_amd64.AppImage
            CAIRN_REGISTRATION_POLICY=invite_only \
              CAIRN_INVITES=me-7f3k9q2m4x8w,friend-2n6v1r5t9z3c \
              CAIRN_SFU_BIND=127.0.0.1:3480 ./cairn-server &
            ./Cairn_*_amd64.AppImage
            ```
