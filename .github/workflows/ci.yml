name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Documentation cannot break a build, and this repository is mostly documentation.
    # A markdown-only commit previously spent a full matrix run proving that.
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
  # So the full matrix can be demanded on a branch when it actually matters.
  workflow_dispatch:

# Pushing twice to a branch used to run the matrix twice. Only the newest commit can be
# merged, so the older run is spent with nothing to show for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The cross-platform claim in docs/09-platform-strategy.md is checked here rather than
  # assumed. Only Linux is verified locally during development.
  #
  # All three on every pull request. macOS used to be held back to merge time because a
  # private repository is billed 10x for it, and the allowance ran out once; the repository
  # is public now, standard runners cost nothing, and an Apple-only failure belongs in
  # review rather than on `main`.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # `cairn-desktop` links the platform webview, and on Linux that means GTK and
      # WebKitGTK development packages. Windows needs nothing — WebView2 ships with the OS —
      # which is why this looked fine there while every Ubuntu job failed in twelve seconds
      # on `glib-2.0 was not found`. `scripts/ci-local.sh` could not have caught it: the
      # development machine already had them installed.
      - name: Install the Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - name: Run the vertical slice
        run: cargo run -p cairn-cli

  # The call mesh is JavaScript, so `cargo test` cannot see a line of it — who offers,
  # whether an early ICE candidate survives, whether the answering side claims the video
  # transceiver rather than stranding it. Every failure there presents as a network fault.
  #
  # Ubuntu only, and cheap: node ships on the runner, and the browser leg installs one
  # Chromium. Nothing here is platform-specific — it is the same JavaScript WebView2 runs.
  desktop:
    name: desktop client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every icon the bundle config names must exist. `tauri-build` hard-errors on Windows
      # without icons/icon.ico, so a missing file does not fail here — it fails partway
      # through the much slower release build.
      - name: Bundle icons present
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path
          root = Path("clients/desktop/src-tauri")
          config = json.loads((root / "tauri.conf.json").read_text())
          missing = [i for i in config["bundle"]["icon"] if not (root / i).is_file()]
          if missing:
              sys.exit("missing bundle icons: " + ", ".join(missing))
          print("all", len(config["bundle"]["icon"]), "bundle icons present")
          EOF

      - run: node --test clients/desktop/tests/mesh.test.js
      # The voice-frame format, JavaScript against the Rust vector in cairn-crypto's media.rs.
      - run: node --test clients/desktop/tests/mediaframe.test.js

      - name: Install Chromium for the browser test
        run: npm install --no-save playwright && npx playwright install --with-deps chromium

      - name: A real call between two browsers
        # Without this the job would report green when the browser failed to install, which
        # is the worst outcome available: a test that cannot run, reported as one that passed.
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/call.browser.test.js

      - name: Calls as people use them, between two browsers
        # Ring, accept, decline, mute and deafen reaching the other side, the speaking ring,
        # per-person volume, push-to-talk, and relay-only offering no address of its own.
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/calls.browser.test.js

      - name: The safety-number panel in a browser
        # The numbers are computed and checked in Rust; this proves the page hands back the
        # exact string it was given and never hides a "key changed" warning.
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/safety.browser.test.js
      - name: Attachments in the real UI
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/attachments.browser.test.js
      - name: The messaging UI in a browser
        # Against a stand-in for the Rust session. The Rust side of each feature is tested in
        # cargo; this is the half a user actually looks at.
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/messaging.browser.test.js
      - name: Edits and delete-for-everyone in a browser
        # Buttons only where Rust allowed them, the edited marker and its history, quotes that
        # follow an edit, and a delete warning that promises no more than the protocol does.
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/edits.browser.test.js
      - name: Voice notes in the real UI
        # Chromium's fake microphone feeds MediaRecorder, so a real recording is made, sent
        # as bytes, and played back through the waveform player.
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/voice.browser.test.js
      - name: The GIF picker in the real UI
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/gifs.browser.test.js
      - name: Profiles in a browser
        # A member's chosen name is drawn as text, an ambiguous one always carries the id,
        # and the card opens safety numbers by id. The record and the attacks are in cargo.
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/profile.browser.test.js
      - name: Link cards render safely in a browser
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/linkcards.browser.test.js
      - name: Appearance settings in a browser
        # Themes and custom CSS are client-side only; this proves they work and that they
        # cannot hide or repaint the encryption badge (docs/13-customisation.md section 5).
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/settings.browser.test.js
      - name: Custom emoji, stickers and the picker in a browser
        # A room's images are read from the local cache by id, once each, before any
        # message uses them -- never fetched at render time (docs/13-customisation.md s3).
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/emoji.browser.test.js
      - name: A soundboard clip crosses a real call
        # Mixed into the microphone track and measured at the listener; no signal sent.
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/soundboard.browser.test.js
      - name: Spaces in a browser
        # The rail, channels and people draw the instance's permission flags and decide none
        # of them; the rules are attacked in cargo (ADR-011).
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/spaces.browser.test.js
      - name: The voice-channel panel in a browser
        # The call's own badge, and a fallback that changes it without touching the room's.
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/voicepanel.browser.test.js

      # The voice channel against the real SFU: the test builds a harness (`cairn-server`'s
      # `sfu_harness` example, `test-tap` feature) holding real sessions in a real MLS group,
      # so this job needs Rust. Only cairn-server and its dependencies are built — not the
      # desktop crate, so no webview packages are needed here.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built as its own step: the test would otherwise compile it inside its 180 s timeout,
      # and on a cold cache that alone took most of it.
      - name: Build the SFU harness
        run: cargo build -p cairn-server --example sfu_harness --features test-tap
      - name: Sealed audio through the SFU between real browsers
        # Audio flows, every frame the SFU held was sealed and opens in Rust, the fallback is
        # announced to everyone, and a removed member is dropped.
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/voicechannel.browser.test.js

      - name: Rooms that are not open, in the whole UI
        # Unread counts and mentions from rooms not on screen, a ring from one reaching the
        # user and declining back to the caller, and a voice channel kept across a room switch.
        env:
          CAIRN_REQUIRE_BROWSER_TEST: '1'
        run: node --test clients/desktop/tests/background.browser.test.js

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Same reason as the test job: clippy has to build `cairn-desktop` to lint it.
      - name: Install the Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  # A dependency with a known vulnerability in a security product is a release blocker,
  # not a nice-to-have.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A prebuilt binary rather than `cargo install cargo-audit --locked`, which compiled
      # the tool from source on every run — minutes spent rebuilding something that had not
      # changed.
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  # 1.88 is a hard floor. It was 1.85 (edition2024, which the crypto tree needs) until the
  # voice-channel SFU: str0m's tree depends on `time` >= 0.3.47, the fix for
  # RUSTSEC-2026-0009, which needs 1.88. The owner chose one floor for the whole workspace
  # over carving the SFU out of it.
  #
  # `cairn-desktop` is excluded only because this runner lacks the webview's system packages;
  # it declares the same floor.
  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude cairn-desktop
      # The server builds without its SFU too, for an operator who wants no voice channels.
      - run: cargo check -p cairn-server --no-default-features
